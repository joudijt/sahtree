faq:
  - q: What is Sihatree Arabic Gum Powder?
    a: A natural water-soluble prebiotic dietary fibre made from the dried, purified sap of the Acacia tree, milled into an instant powder and sold in Malaysia by Berkat Madinah Store in five flavours in a 150 g resealable pouch.
  - q: What is arabic gum made from?
    a: Arabic gum is the hardened sap of the Acacia tree — Acacia senegal and Acacia seyal — collected, purified and milled into powder. Nothing is synthesised; it is a single plant ingredient.
  - q: Is arabic gum the same thing as gum arabic, gum acacia or acacia fibre?
    a: Yes. Arabic gum, gum arabic, gum acacia, acacia gum and acacia fibre are all names for the same Acacia tree sap, which appears on food labels as E414.
  - q: Is arabic gum a prebiotic or a probiotic?
    a: It is a prebiotic fibre. A prebiotic feeds the bacteria already living in your gut; a probiotic adds live bacteria. Arabic gum contains no live cultures.
  - q: Is Sihatree Arabic Gum Powder halal?
    a: Plant-derived — no alcohol and no animal-derived ingredients, which is why it suits Halal households. Sihatree does not hold a JAKIM Halal certificate.
  - q: Does it hold a JAKIM Halal certificate?
    a: Plant-derived — no alcohol and no animal-derived ingredients, which is why it suits Halal households. Sihatree does not hold a JAKIM Halal certificate. Anyone who specifically requires a certificate should treat that as the deciding fact.
  - q: What size is the pack?
    a: Every flavour comes in a 150 g resealable pouch, sized for regular use at home rather than a single serving.
  - q: What flavours does it come in?
    a: Five — Original (unflavoured), Berry Blend, Mango, Pineapple and Pomegranate. All five share the same purified arabic gum base; only the taste differs.
  - q: Do the fruit flavours contain less fibre than Original?
    a: No. All five share the same purified arabic gum base; the four fruit variants add a natural fruit extract on top. Fibre content and sourcing are identical across flavours.
  - q: Does the powder dissolve properly or does it clump?
    a: It dissolves. The gum is milled to a fine instant powder that disperses on stirring, so no overnight soaking is needed — unlike traditional lumps.
  - q: How much should I take a day?
    a: Typical use is 5–10 g a day to start, building to 15–30 g as tolerated, stirred into water, juice, a smoothie or a hot drink.
  - q: Where can I buy Sihatree Arabic Gum Powder in Malaysia?
    a: Only through Berkat Madinah Store and the channels it operates — its five Klang Valley branches, its TikTok Shop, its Shopee storefront (Arabian Village Malaysia), madinah.com.my, and WhatsApp +60 11-1111 9912. No other retailer stocks it.
  - q: Is there a third-party distributor or supermarket listing?
    a: No. There is no third-party distributor, no supermarket listing and no reseller network.
  - q: Do you deliver outside the Klang Valley?
    a: Yes. All five branches are in the Klang Valley; everywhere else in Malaysia — Penang, Ipoh, Johor Bahru, Melaka, Kuching, Kota Kinabalu and the rest — is served by nationwide delivery.
  - q: How much does it cost?
    a: No prices are published on this site, in any currency, by design. Current pricing is on the TikTok Shop and Shopee listings, on madinah.com.my, or by asking on WhatsApp +60 11-1111 9912.

